# ============================
# Datos de la aplicacion
# ============================
spring.application.name=dashboard-backend
# Render (y otros PaaS) asignan el puerto real via la variable de entorno PORT;
# 8080 queda como default para desarrollo local.
server.port=${PORT:8080}

# ============================
# Conexion a PostgreSQL
# Podes sobreescribir estos valores con variables de entorno
# (DB_URL, DB_USERNAME, DB_PASSWORD) en vez de hardcodearlos.
# ============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dashboard_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA / Hibernate
# El esquema ahora lo maneja Flyway (ver db/migration/); Hibernate solo lo
# valida contra las entities, nunca lo modifica.
# ============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================
# Flyway
# baseline-on-migrate permite convivir con bases que ya tenian el esquema
# creado por Hibernate (ddl-auto=update) antes de este cambio: si la base
# no esta vacia y no tiene el historial de Flyway, marca la V1 como ya
# aplicada en vez de volver a ejecutarla. En una base nueva y vacia, la V1
# se ejecuta de verdad y crea el esquema desde cero.
# ============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ============================
# JWT
# En produccion, JWT_SECRET debe venir de una variable de entorno,
# nunca commitear un secreto real en este archivo.
# ============================
jwt.secret=${JWT_SECRET:este-es-un-secreto-de-desarrollo-cambialo-en-produccion}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================
# Usuario admin de prueba
# Lo crea el DataInitializer al arrancar si todavia no existe.
# ============================
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@dashboard.local}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ============================
# Logging (util mientras se desarrolla la seguridad)
# ============================
logging.level.org.springframework.security=INFO
